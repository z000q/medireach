function RippleButton({ className, children, onClick, ...rest }) {
  const [ripples, setRipples] = useState([]);
  const handleClick = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const id = Date.now();
    setRipples((r) => [...r, { id, x: e.clientX - rect.left - size / 2, y: e.clientY - rect.top - size / 2, size }]);
    setTimeout(() => setRipples((r) => r.filter((rp) => rp.id !== id)), 600);
    onClick && onClick(e);
  };
  return (
    <button className={className} onClick={handleClick} {...rest}>
      {children}
      {ripples.map((r) => (
        <span key={r.id} className="mb-ripple" style={{ left: r.x, top: r.y, width: r.size, height: r.size }} />
      ))}
    </button>
  );
}

}

function Confetti({ trigger }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!trigger) return;
    const colors = ["#2563EB", "#14B8A6", "#F59E0B", "#22C55E", "#06B6D4"];
    const newPieces = Array.from({ length: 40 }).map((_, i) => ({
      id: `${trigger}-${i}`,
      left: Math.random() * 100,
      color: colors[i % colors.length],
      duration: 2.2 + Math.random() * 1.4,
      delay: Math.random() * 0.3,
      size: 6 + Math.random() * 6,
    }));
    setPieces(newPieces);
    const t = setTimeout(() => setPieces([]), 4000);
    return () => clearTimeout(t);
  }, [trigger]);

  return (
    <>
      {pieces.map((p) => (
        <span
          key={p.id}
          className="mb-confetti-piece"
          style={{
            left: `${p.left}%`,
            width: p.size,
            height: p.size * 0.5,
            background: p.color,
            animationDuration: `${p.duration}s`,
            animationDelay: `${p.delay}s`,
          }}
        />
      ))}
    </>
  );
}

function useCountUp(target, active) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    if (!active) return;
    let start = null;
    const duration = 1200;
    const step = (ts) => {
      if (!start) start = ts;
      const progress = Math.min((ts - start) / duration, 1);
      setValue(Math.round(target * (1 - Math.pow(1 - progress, 3))));
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [active, target]);
  return value;
}

function useInView() {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) {
        setInView(true);
        obs.disconnect();
      }
    }, { threshold: 0.4 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}

        {STEPS.map((s) => (
          <div key={s.title} className="mb-card hoverable" style={{ padding: "1.5rem" }}>
            <div className="mb-icon-badge" style={{ background: s.grad, marginBottom: "0.9rem" }}>
              <s.icon size={20} />
            </div>
            <h3 style={{ fontWeight: 700, fontSize: "1.05rem", marginBottom: "0.5rem" }}>{s.title}</h3>
            <p style={{ fontSize: "0.88rem", color: "var(--text-muted)" }}>{s.desc}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

function ChatSection() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [celebrate, setCelebrate] = useState(0);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  const sendMessage = async (text) => {
    const trimmed = text.trim();
    if (!trimmed || loading) return;
    const isFirst = messages.length === 0;
    const newMessages = [...messages, { role: "user", content: trimmed }];
    setMessages(newMessages);
    setInput("");
    setLoading(true);
    setError(null);
    if (isFirst) setCelebrate((c) => c + 1);

    if (!CHAT_ENDPOINT_READY) {
      setMessages((prev) => [
        ...prev,
        {
          role: "assistant",
          content:
            "I'm not connected yet! Whoever's setting up this site needs to deploy the API proxy on Vercel and paste the URL into API_BASE_URL near the top of this file. Check README.md for the steps.",
        },
      ]);
      setLoading(false);
      return;
    }

    try {
      // Calls the separately-hosted /api/chat proxy (see api/chat.js and
      // README.md), which holds the real Anthropic API key server-side.
      // The browser never sees the key.
      const response = await fetch(`${API_BASE_URL}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: SYSTEM_PROMPT,
          messages: newMessages.map((m) => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data?.error || `Request failed (${response.status})`);
      const textBlock = (data.content || []).find((b) => b.type === "text");
      const reply = textBlock ? textBlock.text : "I wasn't able to generate a response — try rephrasing.";
      setMessages((prev) => [...prev, { role: "assistant", content: reply }]);
    } catch (err) {
      setError("Something went wrong reaching Clarity. Please try again.");
    } finally {
      setLoading(false);
    }
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    sendMessage(input);
  };

  return (
    <section id="talk" style={{ position: "relative", maxWidth: 740, margin: "0 auto", padding: "1rem 1.25rem 3rem", zIndex: 1 }}>
      <Confetti trigger={celebrate} />
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "0.4rem", marginBottom: "0.6rem" }}>
        <span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--success)", display: "inline-block", boxShadow: "0 0 0 3px rgba(34,197,94,0.2)" }} />
        <span style={{ fontSize: "0.78rem", fontWeight: 700, color: "var(--success)" }}>Clarity is online and ready to help</span>
      </div>
      <h2 style={{ fontSize: "1.9rem", fontWeight: 800, marginBottom: "0.5rem", textAlign: "center" }}>Talk to Clarity</h2>
      <p style={{ color: "var(--text-muted)", textAlign: "center", marginBottom: "1.25rem", fontSize: "0.94rem" }}>
        Whatever's on your mind — a symptom, a worry, or just not knowing where to start.
      </p>

      <div style={{ display: "flex", gap: "0.5rem", flexWrap: "wrap", justifyContent: "center", marginBottom: "1rem" }}>
        {CHAT_STARTERS.map((s) => (
          <button key={s} className="mb-chip" onClick={() => sendMessage(s)}>{s}</button>
        ))}
      </div>

      <div className="mb-card mb-glass mb-chat-shell" style={{ boxShadow: "0 20px 50px rgba(37,99,235,0.12)" }}>
        <div className="mb-messages" ref={scrollRef}>
          {messages.length === 0 && !loading && (
            <div style={{ margin: "auto", textAlign: "center", color: "var(--text-muted)", maxWidth: 320 }}>
              <div className="mb-avatar" style={{ margin: "0 auto 0.9rem" }}><Mascot /></div>
              <p style={{ fontSize: "0.9rem", fontWeight: 600, color: "var(--text)" }}>Hi, I'm Clarity 👋</p>
              <p style={{ fontSize: "0.86rem", marginTop: "0.3rem" }}>Type below, or tap a prompt above to begin.</p>
            </div>
          )}
          {messages.map((m, i) => (
            <div key={i} className={`mb-msg-row ${m.role}`}>
              {m.role === "assistant" && <div className="mb-avatar"><Mascot size={18} /></div>}
              <div className={`mb-bubble ${m.role}`}>
                <span className="mb-bubble-label">{m.role === "user" ? "You" : "Clarity"}</span>
                <span style={{ whiteSpace: "pre-wrap" }}>{m.content}</span>
              </div>
            </div>
          ))}
          {loading && (
            <div className="mb-msg-row assistant">
              <div className="mb-avatar"><Mascot size={18} /></div>
              <div className="mb-bubble assistant">
                <span className="mb-typing-dot" /><span className="mb-typing-dot" /><span className="mb-typing-dot" />
              </div>
            </div>
          )}
          {error && (
            <div className="mb-bubble assistant" style={{ background: "#FEF2F2", color: "#B91C1C" }}>{error}</div>
          )}
        </div>
        <form className="mb-input-row" onSubmit={handleSubmit}>
          <textarea
            className="mb-input"
            rows={1}
            placeholder="Share what's on your mind…"
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                handleSubmit(e);
              }
            }}
          />
          <button type="submit" className="mb-send" disabled={loading || !input.trim()} aria-label="Send">
            <Send size={16} />
          </button>
        </form>
      </div>

      <button onClick={() => setMessages([])} className="mb-navlink" style={{ display: "flex", alignItems: "center", gap: "0.35rem", margin: "0.75rem auto 0" }}>
        <RotateCcw size={13} /> Reset conversation
      </button>
    </section>
  );
}

function SafetySection() {
  return (
    <section style={{ position: "relative", maxWidth: 740, margin: "0 auto", padding: "1rem 1.25rem 3rem", zIndex: 1 }}>
      <div className="mb-card" style={{ padding: "1.6rem", background: "linear-gradient(135deg, #FFFBEB, #FFF)", borderColor: "#FDE68A" }}>
        <div style={{ display: "flex", gap: "0.7rem", alignItems: "flex-start" }}>
          <div className="mb-icon-badge" style={{ background: "var(--accent)" }}>
            <ShieldCheck size={20} />
          </div>
          <div>
            <h3 style={{ fontWeight: 700, marginBottom: "0.5rem" }}>What MediReach is — and isn't</h3>
            <p style={{ fontSize: "0.9rem", marginBottom: "0.6rem" }}>
              Clarity gives general medical information and encourages you toward professional care. It does not

function AboutSection() {
  return (
    <section id="about" style={{ position: "relative", maxWidth: 740, margin: "0 auto", padding: "1rem 1.25rem 4rem", zIndex: 1 }}>
      <h2 style={{ fontSize: "1.9rem", fontWeight: 800, marginBottom: "1.25rem", textAlign: "center" }}>Why I built this</h2>
      <div className="mb-card hoverable" style={{ padding: "1.6rem", marginBottom: "1.25rem" }}>
        <Quote size={20} color="var(--primary)" style={{ marginBottom: "0.6rem" }} />
        <p style={{ fontSize: "0.95rem" }}>
          ✏️ Write a short, honest paragraph here: what led you to notice this problem, why it connects to your
          interest in medicine, and what you learned building it. This is the part an admissions reader will remember.
        </p>
      </div>
      <div className="mb-card hoverable" style={{ padding: "1.6rem" }}>
        <h3 style={{ fontWeight: 700, marginBottom: "0.6rem", fontSize: "1rem" }}>Sources</h3>
        <ul style={{ margin: 0, paddingLeft: "1.1rem", fontSize: "0.85rem", color: "var(--text-muted)" }}>
          <li style={{ marginBottom: "0.3rem" }}>PatientPoint, 2023 & 2024 Patient Confidence Index (surveys of 2,000 U.S. adults)</li>

const NAV_LINKS = [
  { id: "why", label: "Why This Matters", type: "anchor" },
  { id: "how", label: "How It Works", type: "anchor" },
  { id: "chat", label: "Chat with Clarity", type: "page" },
  { id: "about", label: "About", type: "anchor" },
];

function HomePage({ onGoToChat }) {
  return (
    <>
      <Hero onStart={onGoToChat} />
      <StatsSection />
      <HowItWorks />
      <SafetySection />
      <AboutSection />
    </>
  );
}

function ChatPage() {
  return (
    <div style={{ paddingTop: "1rem" }}>
      <ChatSection />
    </div>
  );
}

function App() {
  const [page, setPage] = useState("home");
  const [pendingScroll, setPendingScroll] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [scrollPct, setScrollPct] = useState(0);

  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const pct = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
      setScrollPct(Math.min(1, Math.max(0, pct)));
    };
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  useEffect(() => {
    if (page === "home" && pendingScroll) {
      const id = pendingScroll;
      const t = setTimeout(() => {
        document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
        setPendingScroll(null);
      }, 60);
      return () => clearTimeout(t);
    }
  }, [page, pendingScroll]);

  const goHome = () => {
    setPage("home");
    setMenuOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const goToChat = () => {
    setPage("chat");
    setMenuOpen(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const navigate = (link) => {
    setMenuOpen(false);
    if (link.type === "page") {
      setPage(link.id);
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
    if (page !== "home") {
      setPendingScroll(link.id);
      setPage("home");
    } else {
      document.getElementById(link.id)?.scrollIntoView({ behavior: "smooth" });
    }
  };

  return (
    <div className="mb-root">
      <GlobalStyles />
      <Blobs />

      <nav className="mb-nav">
        <div style={{ maxWidth: 1060, margin: "0 auto", padding: "0.85rem 1.25rem", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <button onClick={goHome} style={{ background: "none", border: "none", fontSize: "1.15rem", fontWeight: 800, color: "var(--text)", cursor: "pointer", display: "flex", alignItems: "center", gap: "0.5rem", fontFamily: "'Plus Jakarta Sans', sans-serif" }}>
            <span style={{ width: 30, height: 30, borderRadius: 9, background: "var(--grad-1)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Mascot size={17} />
            </span>
            MediReach
          </button>
          <div style={{ display: "none", gap: "1.5rem" }} className="mb-nav-desktop">
            {NAV_LINKS.map((l) => (
              <button
                key={l.id}
                className="mb-navlink"
                style={l.type === "page" && page === l.id ? { color: "var(--primary)" } : undefined}
                onClick={() => navigate(l)}
              >
                {l.label}
              </button>
            ))}
          </div>
          <RippleButton className="mb-btn ghost" style={{ padding: "0.55rem 1.1rem", display: "none", fontSize: "0.85rem" }} id="mb-nav-cta" onClick={goToChat}>
            Talk now
          </RippleButton>
          <button className="mb-navlink" style={{ display: "inline-flex" }} onClick={() => setMenuOpen((m) => !m)} aria-label="Toggle menu">
            <Menu size={20} />
          </button>
        </div>
        <style>{`
          @media (min-width: 760px) {
            .mb-nav-desktop { display: flex !important; }
            #mb-nav-cta { display: inline-flex !important; }
            .mb-nav > div > button[aria-label="Toggle menu"] { display: none !important; }
          }
        `}</style>
        {menuOpen && (
          <div style={{ display: "flex", flexDirection: "column", gap: "0.5rem", padding: "0 1.25rem 1rem" }}>
            {NAV_LINKS.map((l) => (
              <button key={l.id} className="mb-navlink" style={{ textAlign: "left" }} onClick={() => navigate(l)}>{l.label}</button>
            ))}
          </div>
        )}
      </nav>
      <div className="mb-progress" style={{ transform: `scaleX(${scrollPct})` }} />

      {page === "home" ? <HomePage onGoToChat={goToChat} /> : <ChatPage />}

      <footer style={{ position: "relative", borderTop: "1px solid var(--border)", padding: "2rem 1.25rem", textAlign: "center", zIndex: 1 }}>
        <p style={{ fontSize: "0.82rem", color: "var(--text-muted)" }}>
          MediReach · Built by {STUDENT_NAME} · Not a substitute for professional medical advice
        </p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
